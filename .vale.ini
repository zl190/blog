StylesPath = styles
MinAlertLevel = warning
Packages = write-good

[*.md]
BasedOnStyles = Vale, write-good, AISmell
Vale.Spelling = NO
# write-good rules are advisory, not blocking
write-good.So = warning
write-good.Weasel = warning
write-good.TooWordy = warning
write-good.Passive = warning
write-good.Cliches = warning
write-good.E-Prime = warning
write-good.Illusions = warning
write-good.ThereIs = warning
